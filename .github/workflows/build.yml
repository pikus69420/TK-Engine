name: Budowa TK Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config libsrtp2-dev

    - name: Build libre and baresip from source
      run: |
        # Build libre
        git clone https://github.com/baresip/re.git /tmp/re
        cd /tmp/re && make && sudo make install
        cd /tmp && rm -rf re

        # Build baresip
        git clone https://github.com/baresip/baresip.git /tmp/baresip
        cd /tmp/baresip && make && sudo make install
        cd /tmp && rm -rf baresip

        sudo ldconfig

    - name: Budowa TK Engine
      run: |
        mkdir build && cd build
        cmake ..
        make

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tkengine-linux
        path: build/libTKEngine.so

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
        C:\vcpkg\bootstrap-vcpkg.bat

    - name: Install dependencies
      run: |
        C:\vcpkg\vcpkg install baresip:x64-windows libsrtp:x64-windows

    - name: Budowa TK Engine
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake
        cmake --build . --config Release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tkengine-windows
        path: build/Release/TKEngine.dll
